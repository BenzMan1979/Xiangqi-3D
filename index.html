<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>楚河漢界：名將對弈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="stage"></div>

    <header id="title">
      <h1>楚河漢界</h1>
      <p>名將對弈 · 單機雙人</p>
    </header>

    <div id="turn" data-side="red" role="status" aria-live="polite">
      <span class="dot"></span><span class="label">紅方走棋</span><span class="check-tag">將軍中</span>
    </div>

    <aside id="moves-panel">
      <h2>棋譜</h2>
      <ol id="moves"></ol>
    </aside>

    <nav id="toolbar">
      <button id="btn-new">新局</button>
      <button id="btn-undo" disabled>悔棋</button>
      <button id="btn-flip">翻轉視角</button>
      <button id="btn-view">俯視</button>
      <button id="btn-settings">設定</button>
      <button id="btn-moves" class="mobile-only">棋譜</button>
      <button id="btn-resign" class="danger">認輸</button>
    </nav>

    <div id="banner"></div>

    <dialog id="result">
      <h2 id="result-title">紅方勝</h2>
      <p id="result-reason">將死</p>
      <div class="actions">
        <button id="btn-again" class="primary">再來一局</button>
        <button id="btn-review">檢視棋局</button>
      </div>
    </dialog>

    <dialog id="settings" aria-labelledby="settings-title">
      <h2 id="settings-title">設定</h2>
      <label class="row">背景音樂<input id="set-music" type="range" min="0" max="100" /></label>
      <label class="row">音效<input id="set-sfx" type="range" min="0" max="100" /></label>
      <fieldset class="row">
        <legend>特效強度</legend>
        <div class="segmented">
          <label><input type="radio" name="fx" value="full" />完整</label>
          <label><input type="radio" name="fx" value="reduced" />精簡</label>
          <label><input type="radio" name="fx" value="off" />關閉</label>
        </div>
      </fieldset>
      <label class="row check"><input id="set-cards" type="checkbox" />顯示人物立牌</label>
      <label class="row check"><input id="set-autoflip" type="checkbox" />每步後自動轉到走棋方視角</label>
      <div class="actions"><button id="btn-settings-close" class="primary">完成</button></div>
    </dialog>

    <div id="setup" hidden>
      <div class="setup-inner">
        <h2>選擇陣營</h2>
        <div class="modes" role="group" aria-label="對戰模式">
          <button class="mode" data-mode="local">單機雙人</button>
          <button class="mode" data-mode="ai">AI 對戰</button>
          <button class="mode" disabled>連線對戰<small>即將推出</small></button>
        </div>
        <div id="ai-options" hidden>
          <fieldset class="opt-group">
            <legend>電腦難度</legend>
            <div class="levels" id="level-list"></div>
          </fieldset>
          <fieldset class="opt-group">
            <legend>你執</legend>
            <div class="levels" id="side-list">
              <button class="level" data-human="red"><b>紅方</b><small>先手</small></button>
              <button class="level" data-human="black"><b>黑方</b><small>後手</small></button>
            </div>
          </fieldset>
        </div>
        <div class="sides">
          <section class="side-pick" data-side="red">
            <h3><span class="dot"></span>紅方<span class="who"></span></h3>
            <div class="faction-grid"></div>
            <div class="faction-preview"></div>
          </section>
          <div class="vs">對</div>
          <section class="side-pick" data-side="black">
            <h3><span class="dot"></span>黑方<span class="who"></span></h3>
            <div class="faction-grid"></div>
            <div class="faction-preview"></div>
          </section>
        </div>
        <p class="setup-hint">滑鼠移到人物名字上可查看介紹與絕招（手機請點名字）</p>
        <button id="btn-start" class="primary">開始對弈</button>
      </div>
    </div>

    <div id="loading">載入中…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
